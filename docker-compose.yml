services:
  ythril:
    image: ghcr.io/ythril-network/ythril:latest
    container_name: ythril
    restart: unless-stopped
    # A memory ceiling, so one instance cannot take a shared host down with it. Node sizes its heap from
    # the container limit, so the app runs inside it rather than into it. Raise YTHRIL_MEM_LIMIT in .env for
    # very large ingests or document batches; an infra deployment sets its own pod limit instead.
    mem_limit: ${YTHRIL_MEM_LIMIT:-4g}
    ports:
      - "${YTHRIL_PORT:-3200}:3200"
    volumes:
      # Config and secrets — keep outside image, mode 0600 enforced at startup
      - ./config:/config
      # Persistent data: uploaded files, etc.
      - ythril-data:/data
    environment:
      CONFIG_PATH: /config/config.json
      DATA_ROOT: /data
      NODE_ENV: production
      # Credentials for the BUNDLED database (see the ythril-mongo service below and
      # .env.example). When set, Ythril connects with authentication; when empty it falls
      # back to the historical unauthenticated URI, so existing installs keep working.
      # An explicit MONGO_URI (external cluster / managed Atlas) overrides both.
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      # External MongoDB (managed Atlas / self-hosted cluster): set MONGO_URI in .env to
      # point Ythril at an external database instead of the bundled ythril-mongo (C4).
      # Empty (the default) keeps the bundled database. When you set this, also consider
      # YTHRIL_MONGO_INFRA_MANAGED=true (below) to disable API-driven migration.
      MONGO_URI: ${MONGO_URI:-}
      # Document-conversion sidecar (PDF / DOCX / EPUB → Markdown). Defaults to the bundled
      # `unstructured` service defined below; override to use an external converter (C2).
      CONVERSION_SIDECAR_URL: ${CONVERSION_SIDECAR_URL:-http://unstructured:8000}
      # Page-render sidecar (PDF → page images) for the F11 VLM extraction path. Defaults to the bundled
      # `doc-render` service below; only used when documentProcessing.mode is vlm/auto/repair.
      RENDER_SIDECAR_URL: ${RENDER_SIDECAR_URL:-http://doc-render:8100}
      # Office → page-image rendering (F11-a). Points at the opt-in `doc-office` sidecar (below, enabled
      # with `--profile office`). When that service isn't running, office docs fall back to OCR.
      RENDER_OFFICE_SIDECAR_URL: ${RENDER_OFFICE_SIDECAR_URL:-http://doc-office:8100}
      # F-31 — the NLP sidecar the conversation extractor finds its candidate mentions with (`doc-nlp` below).
      NLP_SIDECAR_URL: ${NLP_SIDECAR_URL:-http://doc-nlp:8102}
      # Managed infra: set to "true" to make the whole media/model config (vision, STT, document extraction,
      # assist model) read-only in the admin UI/API — set the values in config.json / env instead. Mirrors
      # YTHRIL_MONGO_INFRA_MANAGED for the database. PATCH /api/admin/media-config then returns 409.
      YTHRIL_MEDIA_INFRA_MANAGED: ${YTHRIL_MEDIA_INFRA_MANAGED:-}
      YTHRIL_LOCAL_AGENT_ENABLED: ${YTHRIL_LOCAL_AGENT_ENABLED:-}
      # Numeric loopback on purpose: the server rejects a non-loopback (or DNS-resolved `localhost`)
      # host unless YTHRIL_LOCAL_AGENT_ALLOW_REMOTE=true, to keep the bearer token on-box. The feature is
      # off by default (YTHRIL_LOCAL_AGENT_ENABLED empty above), so this is just a sane accepted default.
      #
      # To use it in Docker, the connector runs on the HOST, not in this container, so `127.0.0.1` here
      # can't reach it. Set these three (via `.env`, or a gitignored docker-compose.override.yml — see
      # docs/workstation-mode-guide.md), adding an `extra_hosts: ["host-gateway:host-gateway"]` mapping:
      #   YTHRIL_LOCAL_AGENT_URL=http://host-gateway:38123   # reach the host across the Docker bridge
      #   YTHRIL_LOCAL_AGENT_ALLOW_REMOTE=true               # host-gateway isn't loopback from in here
      #   YTHRIL_LOCAL_AGENT_ALLOW_INSECURE=true             # HTTP is fine: it never leaves the machine
      YTHRIL_LOCAL_AGENT_URL: ${YTHRIL_LOCAL_AGENT_URL:-http://127.0.0.1:38123}
      YTHRIL_LOCAL_AGENT_TOKEN: ${YTHRIL_LOCAL_AGENT_TOKEN:-}
      # Face recognition (opt-in). Passed through so an infra admin can pin it without
      # editing config.json inside the container — FACE_RECOGNITION_ENABLED=false is the
      # documented guarantee that no faces are detected or embedded on this instance,
      # and it can only hold if the variable actually reaches the process.
      FACE_RECOGNITION_ENABLED: ${FACE_RECOGNITION_ENABLED:-}
      FACE_RECOGNITION_CONFIDENCE_THRESHOLD: ${FACE_RECOGNITION_CONFIDENCE_THRESHOLD:-}
      FACE_RECOGNITION_MIN_FACE_SIZE_FRACTION: ${FACE_RECOGNITION_MIN_FACE_SIZE_FRACTION:-}
      FACE_RECOGNITION_MODEL_PATH: ${FACE_RECOGNITION_MODEL_PATH:-}
      FACE_RECOGNITION_PERSON_ENTITY_TYPES: ${FACE_RECOGNITION_PERSON_ENTITY_TYPES:-}
      FACE_RECOGNITION_REPROCESS_SYNCED_IMAGES: ${FACE_RECOGNITION_REPROCESS_SYNCED_IMAGES:-}
      # Pass DEBUG=1 from the host shell to enable verbose logging:
      #   DEBUG=1 docker compose up
      DEBUG: ${DEBUG:-}
      # If you supply MONGO_URI to point at an external database, set this flag
      # to prevent API-driven migration (POST /api/admin/data/migrate):
      #   YTHRIL_MONGO_INFRA_MANAGED: "true"
    depends_on:
      ythril-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ythril-db        # database access
      - ythril-media     # outbound internet + media sidecars
      - ythril-convert   # document-conversion sidecar (isolated: no DB, no internet)

  ythril-mongo:
    # mongodb/mongodb-atlas-local includes mongot — required for $vectorSearch.
    # Pinned to the current manifest-list digest. Refresh:
    #   docker buildx imagetools inspect mongodb/mongodb-atlas-local:latest
    image: mongodb/mongodb-atlas-local:latest@sha256:1cd040bb201bb7f910c7c6ab7f6cb8ab9dd79331f6a213f37025adc6804e96aa
    container_name: ythril-mongo
    # Pin hostname so the replica-set config remains valid across container restarts.
    # Without this, each `docker compose down && up` gets a new random hostname,
    # causing "Our replica set config is invalid or we are not a member of it".
    hostname: ythril-mongo
    restart: unless-stopped
    # Uncapped, MongoDB sizes its cache from the WHOLE host (half of it, less a gigabyte). With a ceiling it
    # sizes the cache from the ceiling instead, so this caps the cache too. The image also runs mongot, the
    # vector-search process, inside the same limit. Raise YTHRIL_MONGO_MEM_LIMIT for very large spaces.
    mem_limit: ${YTHRIL_MONGO_MEM_LIMIT:-4g}
    logging:
      driver: "none"
    environment:
      # SECURITY: authenticate the bundled database. Unauthenticated, anything that can reach
      # port 27017 can read and rewrite EVERY space — Ythril's tokens, space scoping and audit
      # log are enforced at the API layer only, not at the database (S7).
      #
      # Set MONGO_USERNAME / MONGO_PASSWORD in .env (see .env.example). New installs should
      # always set them. They are OPTIONAL, and empty means "no auth", because MongoDB cannot
      # have auth switched on in place: the Atlas Local image runs a single-node replica set
      # (needed for $vectorSearch) and only provisions the required internal keyfile on a
      # FIRST init. Adding credentials to an existing database therefore does NOT enable auth
      # — it makes mongod fail to start ("Unable to acquire security key[s]"). Migrating an
      # existing database is a deliberate, documented dump/restore (see docs/dependencies.md).
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
    volumes:
      - ythril-mongo-data:/data/db
      - ythril-mongo-configdb:/data/configdb
    healthcheck:
      # Wait for the replica set to elect a primary (not just mongod accepting connections).
      # mongosh does NOT pick the root credentials up from the environment, so pass them
      # explicitly — otherwise the healthcheck fails permanently once auth is enabled.
      # Falls back to an unauthenticated probe when no credentials are configured.
      test: ["CMD", "sh", "-c", "if [ -n \"$$MONGODB_INITDB_ROOT_USERNAME\" ]; then mongosh --quiet -u \"$$MONGODB_INITDB_ROOT_USERNAME\" -p \"$$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({replSetGetStatus:1}).myState===1 ? 1 : quit(1)'; else mongosh --quiet --eval 'db.adminCommand({replSetGetStatus:1}).myState===1 ? 1 : quit(1)'; fi"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    networks:
      - ythril-db        # ONLY here: unreachable from the media sidecars

  # ── Media embedding stack (image / audio / video → text → embedding) ──────
  # On by default to mirror the K8s setup (kubernetes/manifests/{ollama,whisper}-deploy.yaml).
  # Disable for resource-constrained or infra-managed deployments by either:
  #   1. Setting `mediaEmbedding.enabled: false` in config/config.json
  #      (containers still run but no jobs are enqueued), or
  #   2. Setting `OLLAMA_REPLICAS=0` / `WHISPER_REPLICAS=0` in .env — the deployment-level
  #      switch below, which keeps the container out of the stack entirely.
  ollama:
    # Pinned to the current multi-arch manifest-list digest (reproducible; a re-pull can't silently
    # substitute a different image). Refresh: docker buildx imagetools inspect ollama/ollama:latest.
    image: ollama/ollama:latest@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    container_name: ythril-ollama
    restart: unless-stopped
    # Infra switch: `OLLAMA_REPLICAS=0` in .env keeps this service out of the deployment entirely
    # (a running container is stopped and removed on the next `up`). Vision captioning then reports
    # the provider as unreachable and the rest of the stack is unaffected.
    deploy:
      replicas: ${OLLAMA_REPLICAS:-1}
    # Parses untrusted user media — hardened to match kubernetes/manifests/ollama-deploy.yaml
    # (readOnlyRootFilesystem + drop ALL + resource limits). Compose was the gap.
    # Everything it writes goes to the models volume; /tmp is a tmpfs so the rootfs stays read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    # Sized from a live measurement, not a guess: a moondream vision caption peaked at ~2.4 GB RSS,
    # ~8 cores and 43 threads on a 16-core host. `pids_limit` counts THREADS, and inference threads
    # scale with the host's core count, so the ceiling is deliberately far above that — it exists to
    # stop a fork bomb, not to size inference. Override in .env when you run a larger vision model
    # (llava:13b and friends need noticeably more than moondream's 1.7 GB of weights).
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
    pids_limit: ${OLLAMA_PIDS_LIMIT:-2048}
    cpus: ${OLLAMA_CPUS:-8.0}
    # Auto-pull the default vision model on first start so the first upload
    # does not fail with "model not found". Subsequent restarts no-op.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVE_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull moondream || echo "WARN: moondream pull failed; will retry on first request"
        wait $$SERVE_PID
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ythril-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ythril-media     # deliberately NOT on ythril-db

  whisper:
    # Pinned to the current multi-arch manifest-list digest. Refresh:
    #   docker buildx imagetools inspect fedirz/faster-whisper-server:latest-cpu
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    container_name: ythril-whisper
    restart: unless-stopped
    # Infra switch — see the ollama note above. `WHISPER_REPLICAS=0` in .env drops it entirely.
    deploy:
      replicas: ${WHISPER_REPLICAS:-1}
    # Parses untrusted user media — same treatment as ollama below, with ONE exception:
    # NO `read_only` here. Verified against the live image: faster-whisper-server is launched through
    # `uv run`, which rewrites its own virtualenv (`/root/faster-whisper-server/.venv/...`) on every
    # start — a read-only rootfs makes it crash-loop with "Read-only file system (os error 30)".
    # Seeding a named volume over the venv would "fix" it while silently pinning the OLD venv across
    # image upgrades, which is worse. Everything else below still applies.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m
    # Measured: a 3 s clip through faster-whisper `small` peaked at ~1.4 GB RSS, ~4 cores, 42 threads.
    # Raise WHISPER_MEM_LIMIT if you point `mediaEmbedding.stt.model` at a large-v3 class model.
    mem_limit: ${WHISPER_MEM_LIMIT:-4g}
    pids_limit: ${WHISPER_PIDS_LIMIT:-1024}
    cpus: ${WHISPER_CPUS:-4.0}
    # NOTE: no WHISPER_MODEL here on purpose. Ythril sends the model with every request
    # (`mediaEmbedding.stt.model`, default `base`) and faster-whisper-server downloads it on first use,
    # so a compose-level default would be dead config — the image's own knob is WHISPER__MODEL
    # (double underscore, pydantic nested settings), which the single-underscore spelling never set.
    volumes:
      - ythril-whisper-cache:/root/.cache
    healthcheck:
      # faster-whisper-server is python-based; use the bundled interpreter rather
      # than relying on curl/wget being present in the slim base image. The image
      # exposes `python3` (not a bare `python`), so probe with that.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health',timeout=3).read() or sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ythril-media     # deliberately NOT on ythril-db

  # ── Document-conversion sidecar (PDF / DOCX / EPUB → Markdown) ─────────────
  # Bundles the `unstructured-api` server (C2). Without it, `docker compose up`
  # leaves CONVERSION_SIDECAR_URL pointing at nothing and PDF/DOCX/EPUB uploads fail
  # `sidecar_down` — Ythril itself still runs, so it is intentionally NOT a startup
  # dependency of the ythril service (conversion degrades gracefully until it is up).
  #
  # HEAVY IMAGE: unstructured-api bundles OCR model weights (Tesseract). ≈10.8 GB download, 20–32 GB on disk (varies by storage driver):
  # the download is measured from the registry manifest (26 layers); on-disk depends on the storage
  # driver, so it is a range, not one number — 20.7 GB was measured on k3s/containerd and 31.9 GB on
  # Docker Desktop. First boot is slow, hence the long start_period. See
  # docs/dependencies.md. To skip it entirely on a resource-constrained workstation, set
  # `UNSTRUCTURED_REPLICAS=0` in .env (below); in-process text/HTML conversion and all other
  # features keep working — only PDF/DOCX/EPUB conversion is unavailable.
  #
  # Isolation: it parses UNTRUSTED user-supplied documents, so it sits on its own
  # internal `ythril-convert` network — no database access and no internet egress
  # (its models are baked into the image). This mirrors the Kubernetes deployment,
  # where the sidecar runs pod-local behind NetworkPolicy egress rules.
  unstructured:
    # Pin the tag and verify the bundled LICENSE (Apache-2.0) before upgrading:
    #   docker run --rm --entrypoint cat <image> /app/LICENSE
    # NOTE: the `-full` variant was made private on quay.io (401 UNAUTHORIZED on pull).
    # The public `unstructured-api` image is the same release minus extra Tesseract
    # language packs / LibreOffice, and fully supports the hi_res OCR + image-extraction
    # path Ythril uses. Upstream's README points self-hosters at this image too.
    # Pinned to the manifest-list digest, like every other external image here. This was missed when
    # the others were pinned — and it is the highest-risk parser in the stack, so a silent substitution
    # matters most here. Refresh:
    #   docker buildx imagetools inspect downloads.unstructured.io/unstructured-io/unstructured-api:0.1.2
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.1.2@sha256:986bc7e5d6c24916c22d45d925db366f55bf4d2ebb0079a7b5d38b48fbc6fb1d
    container_name: ythril-unstructured
    restart: unless-stopped
    # Infra switch — this is the HEAVY one (≈10.8 GB download, 20–32 GB on disk), so a deployment that
    # does not need server-side PDF/DOCX/EPUB conversion should not pay for it: `UNSTRUCTURED_REPLICAS=0`
    # in .env keeps it out of the stack (and out of the first `docker compose up` pull). Conversion then
    # reports `sidecar_down` — the same graceful degradation as an external converter being unreachable —
    # and in-process text/HTML conversion plus every other feature keeps working. Set
    # CONVERSION_SIDECAR_URL as well when you point Ythril at an external converter instead.
    deploy:
      replicas: ${UNSTRUCTURED_REPLICAS:-1}
    # Parses untrusted user documents (OCR) — the highest-risk parser in the stack, so it gets the same
    # treatment as doc-render below. It has no volume: everything it writes is per-request scratch, which
    # is what the /tmp tmpfs is for (hi_res OCR spills page images there).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g
    environment:
      # Everything this service writes at request time has to land in the tmpfs above, or the
      # read-only rootfs breaks it. Verified by running a real hi_res extraction:
      #   - numba compiles `projection_by_bboxes` and caches it NEXT TO the package by default,
      #     which fails with "no locator available for file …/xycut.py" on a read-only rootfs;
      #   - matplotlib wants a config dir;
      #   - torch inductor already uses TMPDIR, so /tmp covers it.
      NUMBA_CACHE_DIR: /tmp/numba
      MPLCONFIGDIR: /tmp/matplotlib
      # NOT a hardening flag — this fixes hi_res extraction outright. The layout and table models
      # (`unstructuredio/yolo_x_layout`, `microsoft/table-transformer-structure-recognition`) ARE
      # baked into the image, but huggingface_hub still calls the hub to resolve them; this service
      # sits on the INTERNAL `ythril-convert` network with no internet, so that call fails and the
      # request dies with "Can't load image processor for 'microsoft/table-transformer-…'". Offline
      # mode makes it use the models it already has. (Do NOT set HOME or XDG_CACHE_HOME here —
      # they are what locates that baked cache.)
      HF_HUB_OFFLINE: "1"
    # Measured on a real hi_res extraction: 1.73 GB RSS and 61 threads. OCR memory scales with page
    # count/DPI, so this ceiling stays generous; raise it in .env for very large scans rather than
    # letting a malformed document take the host down with it.
    mem_limit: ${UNSTRUCTURED_MEM_LIMIT:-6g}
    pids_limit: ${UNSTRUCTURED_PIDS_LIMIT:-1024}
    cpus: ${UNSTRUCTURED_CPUS:-4.0}
    healthcheck:
      # The image is a Python/uvicorn service; probe /healthcheck with the bundled
      # interpreter rather than assuming curl/wget is present.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthcheck',timeout=3).read() or sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - ythril-convert   # isolated: no DB, no internet

  # ── Page-render sidecar (PDF → page PNGs) for the F11 VLM extraction path ──────
  # A tiny PDFium (pypdfium2) service — Apache-2.0/BSD, deliberately NOT AGPL PyMuPDF. Like `unstructured`,
  # it parses UNTRUSTED user documents, so it sits on the
  # same isolated internal `ythril-convert` network — no database access and no internet egress — and
  # runs non-root (see sidecars/doc-render/Dockerfile). Only used when documentProcessing.mode is
  # vlm/auto/repair; NOT a startup dependency (VLM extraction degrades to OCR when it is absent). It is
  # light (~python-slim + pypdfium2, no model weights), so leaving it running is cheap.
  doc-render:
    build: ./sidecars/doc-render
    image: ythril-doc-render:0.1.0
    container_name: ythril-doc-render
    restart: unless-stopped
    # Defence in depth on top of the internal network + non-root user.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Overridable from .env like every other ceiling: a host that renders large or dense PDFs needs more
    # headroom than the default, and an operator raising it should not have to edit this file.
    mem_limit: ${DOC_RENDER_MEM_LIMIT:-1g}
    # This is our own tiny single-process (uvicorn --workers 1) service, so CPU/PID ceilings are safe to
    # set here — they bound a malformed-PDF CPU-spin or a fork attempt without risking normal operation.
    cpus: ${DOC_RENDER_CPUS:-1.0}
    pids_limit: ${DOC_RENDER_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8100/health',timeout=3).read() or sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ythril-convert   # isolated: no DB, no internet

  # Office → page-image rendering (F11-a) — OPTIONAL / opt-in. LibreOffice converts DOCX/EPUB/… to PDF,
  # then rasterizes to PNGs (same contract as doc-render). It is heavy (LibreOffice ≈ +1 GB), so it is
  # gated behind the `office` profile and only starts with `docker compose --profile office up -d`; without
  # it, office docs in a VLM extraction mode fall back to OCR. Parses untrusted docs → same hardening as
  # doc-render, plus a tmpfs for the per-request LibreOffice profile (the rootfs stays read-only).
  doc-office:
    profiles: ["office"]
    build: ./sidecars/doc-office
    image: ythril-doc-office:0.1.0
    container_name: ythril-doc-office
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LibreOffice needs more headroom than the tiny PDF renderer, and forks helper processes — and how much
    # more depends on the documents, so the ceilings are overridable from .env rather than fixed here.
    mem_limit: ${DOC_OFFICE_MEM_LIMIT:-2g}
    cpus: ${DOC_OFFICE_CPUS:-2.0}
    pids_limit: ${DOC_OFFICE_PIDS_LIMIT:-512}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8100/health',timeout=3).read() or sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ythril-convert   # isolated: no DB, no internet

  # Candidate mentions for the conversation extractor (F-31): spaCy's transformer pipeline on CPU PyTorch,
  # ~3 GB. Bundled like the other models; `DOC_NLP_REPLICAS=0` in .env leaves it out, and conversation
  # extraction is then refused with that setting named. It reads conversation text, so it gets the
  # doc-render hardening: non-root, read-only rootfs (a tmpfs for the model cache), internal network, no egress.
  doc-nlp:
    build: ./sidecars/doc-nlp
    image: ythril-doc-nlp:0.1.0
    container_name: ythril-doc-nlp
    restart: unless-stopped
    deploy:
      replicas: ${DOC_NLP_REPLICAS:-1}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${DOC_NLP_MEM_LIMIT:-3g}
    cpus: ${DOC_NLP_CPUS:-2.0}
    pids_limit: ${DOC_NLP_PIDS_LIMIT:-256}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8102/health',timeout=3).read() or sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ythril-convert   # isolated: no DB, no internet

volumes:
  ythril-data:
  ythril-mongo-data:
  ythril-mongo-configdb:
  ythril-ollama-models:
  ythril-whisper-cache:

networks:
  # SECURITY: the database and the media sidecars are deliberately on SEPARATE networks.
  #
  # ollama and whisper exist to parse untrusted user-supplied media (uploaded images,
  # audio, video) — they are the highest-risk attack surface here. MongoDB has no
  # authentication, so Ythril's entire security model (PATs, admin gating, space scoping,
  # read-only tokens, the audit log) is enforced at the API layer and NOT at the database.
  # If a media sidecar could reach port 27017, a parser exploit in it would mean
  # unauthenticated read/write of every space in the brain, invisible to the audit log.
  #
  # `ythril` is the only service on both networks, so it can talk to mongo AND to the
  # sidecars, while the sidecars cannot resolve or reach mongo at all. This mirrors what
  # the Kubernetes deployment already enforces via NetworkPolicy egress rules
  # (kubernetes/manifests/media-netpol.yaml) — Compose was the gap.
  ythril-db:
    driver: bridge
    # Mongo needs no outbound internet access; keeping this network internal means a
    # compromised database container cannot exfiltrate.
    internal: true
  ythril-media:
    driver: bridge
    # NOT internal: ythril reaches external embedding/LLM endpoints through this network,
    # and ollama/whisper download their models from the internet.
    internal: false
  ythril-convert:
    driver: bridge
    # The document-conversion sidecar parses untrusted PDF/DOCX/EPUB and needs neither
    # the database nor the internet (its OCR models are baked into the image), so this
    # network is internal — a parser exploit there can reach nothing but ythril.
    internal: true
