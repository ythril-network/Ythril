name: Publish Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # `contents: write` so the run can create the GitHub Release. It was `read`, which is why the
  # announcement half never existed: images went to both registries on every `v*` tag while
  # `v2.6.0` through `v3.0.1` got no Release at all, and the page showed 2.5.1 as Latest for
  # five weeks.
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate below reads git history to decide whether HEAD is a tag. A shallow clone with no tags
          # answers "no", which would silently downgrade the release checks to their mid-cycle form.
          fetch-depth: 0

      # ── The documentation release gate ────────────────────────────────────
      #
      # Owner rule, 2026-08-04: the documentation lens is a release gate. It runs FIRST, before login and before
      # the build, because the three things it checks are the three a published release can never take back:
      # an image on two public registries, notes that do not describe it, and an attribution that was owed.
      #
      # Two of its checks are only true at release time and therefore cannot be enforced per PR: that the four
      # manifests agree on one version, and that `[Unreleased]` has been closed into a dated section. The rest
      # (docs coverage, NOTICE) also runs in CI, and repeating it here costs ~2 minutes against a ~30-minute
      # multi-arch build — worth it, because it also catches a tag cut from a commit whose CI never ran.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ONNXRUNTIME_NODE_INSTALL_CUDA=skip is not an optimisation, it is what makes this step hermetic.
      #
      # onnxruntime-node ships its CUDA execution-provider binaries OUTSIDE npm (too large for the registry) and
      # its postinstall downloads them from a GitHub release. On a runner with no nvcc the script logs
      # "`nvcc` not found. Assuming CUDA 12" and downloads the GPU tarball anyway - so every build depended on a
      # GitHub release fetch succeeding, for binaries no runner here can use.
      #
      # It failed twice in 35 minutes on 2026-08-12 with ECONNRESET / socket hang up, killing the job in ~37
      # seconds. Reading it as a test failure wastes the diagnosis; a job that dies that fast died before the
      # tests. `skip` is the flag the install script documents for exactly this.
      #
      # NOT a retry. A retry around a network fetch hides the non-hermeticity and still fails when the release
      # host is down; removing the fetch removes the dependency.
      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build (the doc gates read server/dist)
        run: npm run build

      - name: Documentation release gate
        run: npm run release:gate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/ythril-network/ythril
            docker.io/ythril/ythril
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # The licence obligation, verified against the ARTEFACT rather than the instruction.
      #
      # `testing/standalone/notice-ships-in-the-image.test.js` asserts the Dockerfile copies NOTICE and LICENSE in,
      # because that check has to run without Docker. It cannot see whether the COPY landed where the image serves
      # from — and a COPY that silently lands in the wrong place passes every unit test there is. So the published
      # image is asked directly.
      #
      # This exists because it once did not: 2.2.5 shipped with neither file. The image is the primary distribution,
      # so it was the one place Apache-2.0 §4(d) and the MIT notice clause actually applied, and the one place they
      # were unmet.
      # The ffmpeg licence, verified against the BINARY rather than against our own documents.
      #
      # `ffmpeg-licensing-is-stated.test.js` asserts the Dockerfile comment and NOTICE agree with each other,
      # because that check must run without Docker. Two documents agreeing is not the same as either being TRUE:
      # the original bug was a Dockerfile that claimed LGPL-only while Debian shipped a GPL build, and no
      # document-level check could ever have caught it.
      #
      # So the published image is asked what it actually contains. If Debian ever ships an LGPL build, or if
      # somebody switches to a custom one, this fails and NOTICE has to be updated in the same change — which is
      # the whole point: the artefact is what we redistribute, so the artefact is what has to match the notice.
      - name: Verify ffmpeg is the licence NOTICE claims
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          BUILD="$(docker run --rm --entrypoint ffmpeg "$IMAGE" -buildconf 2>/dev/null || true)"
          if [ -z "$BUILD" ]; then
            echo "  FAIL: could not run ffmpeg -buildconf in $IMAGE."
            echo "  If ffmpeg was deliberately removed, drop this step AND its NOTICE section in the same change."
            exit 1
          fi
          if echo "$BUILD" | grep -q -- "--enable-gpl"; then
            ACTUAL="GPL-2.0-or-later"
          else
            ACTUAL="LGPL-2.1-or-later"
          fi
          echo "  ffmpeg as built: $ACTUAL"
          # NOTICE ships inside the image, so the comparison is image-internal and cannot drift from the tag.
          if docker run --rm --entrypoint sh "$IMAGE" -c "grep -q 'General Public License v2.0 or later' /app/NOTICE"; then
            CLAIMED="GPL-2.0-or-later"
          else
            CLAIMED="LGPL-2.1-or-later"
          fi
          echo "  NOTICE claims:  $CLAIMED"
          if [ "$ACTUAL" != "$CLAIMED" ]; then
            echo "  FAIL: the shipped ffmpeg is $ACTUAL but NOTICE documents $CLAIMED."
            echo "  Update the NOTICE section \"Runtime Dependency: FFmpeg\" and the Dockerfile comment to match"
            echo "  the binary. This is the exact drift that shipped in 2.2.5 undetected."
            exit 1
          fi
          echo "  ok: the binary and NOTICE agree"

      - name: Verify the licence and notices are in the published image
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Checking $IMAGE"
          # schema/LICENSE and schema/NOTICE: @ythril/schema is Apache-2.0 with its own notices, shipped beside its build.
          for f in NOTICE LICENSE schema/LICENSE schema/NOTICE; do
            if docker run --rm --entrypoint sh "$IMAGE" -c "test -s /app/$f"; then
              echo "  ok: /app/$f present and non-empty"
            else
              echo "  FAIL: /app/$f is missing or empty in the published image."
              echo "  Apache-2.0 4(d) and the MIT notice clause require the notices to travel with the copy."
              exit 1
            fi
          done

      # The half a PERSON reads. The images above are the half a machine consumes, and until 3.1.0 only that
      # half had a mechanism — six tags shipped with no Release and nothing noticed, because nothing was
      # watching for an absence.
      #
      # LAST, deliberately: after the image is pushed and after the licence checks have passed against the
      # published artefact. A Release is an announcement, and announcing a build that then fails its own
      # NOTICE verification is worse than announcing nothing.
      #
      # The notes come from the CHANGELOG section for this tag, through the same extraction `release-gate.mjs`
      # uses to check it is dated and non-empty. `release-notes.mjs` exits non-zero when the section is
      # missing or thin, so a tag pushed without closing `[Unreleased]` fails here instead of publishing a
      # release that describes nothing.
      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" release-notes.md

          # `--latest` is a DECISION, not a default. `gh` marks a new release latest unless told otherwise,
          # which is right for a forward release and wrong for a backfilled older one — that would announce an
          # superseded version as newest. So it is claimed only when this tag really is the highest.
          HIGHEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ "$GITHUB_REF_NAME" = "$HIGHEST" ]; then LATEST=true; else LATEST=false; fi
          echo "tag=$GITHUB_REF_NAME highest=$HIGHEST latest=$LATEST"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists — updating its notes rather than failing the publish."
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --latest="$LATEST"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Ythril $VERSION" \
              --notes-file release-notes.md \
              --latest="$LATEST"
          fi
