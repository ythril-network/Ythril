name: CI

on:
  # Release branches too (Q-56): a patch is bumped through a PR into release/X.Y.x, and Build & Test is the merge gate.
  pull_request:
    branches: [main, 'release/**']
    # `labeled` starts a run when `ci:full` is added, so the label reaches the `reuse` job (its event payload lists the labels):
    # the one lever that forces the whole graph on a pull request (Q-710). Exactly these four, held by ci-workflow-is-sound.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Called by full-run.yml, which runs this whole graph for a push to a `full-run/<bundle>` ref: the bundle's one full run
  # on CI before its pull request is opened (D-15). It takes no input and no secret, so a caller has nothing to pass; the
  # called jobs see the caller's event (a push) and ref, so the cache writes below stay main-only.
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Exactly this and nothing wider (held by ci-workflow-is-sound). A job that needs more says so on the job:
# only `reuse`, `Build & Test` and `ci-advisory` do, and only `actions: read` (the Actions API of another or this run).
permissions:
  contents: read

# One run per ref. A newer push to a PULL REQUEST supersedes the older run; a push to main (or a release branch) is
# never cancelled, because it is the run that writes the layer caches every later run reads. A FULL RUN is called by
# full-run.yml: its caller's own concurrency group supersedes the older run of the same `full-run/<bundle>` ref, and a
# main push is never cancelled by it (the caller's group is per ref, and no main push comes through the caller).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── The job graph (bundle-56, bundle-244) ─────────────────────────────────────────────────────────────────────────
#
# Two jobs decide and check before any suite; both start at t=0, in parallel with the suites that do not wait for `reuse`:
#
#   reuse               pull requests only: is there a green Full run of this very tree (same commit tree as the pull
#                       request's head, a Full run of that head that passed and left every result)? If so its one output,
#                       `full_run` ("<run id>.<attempt>"), names it and every suite job below STANDS DOWN (`if: !cancelled()
#                       && needs.reuse.outputs.full_run == ''`): the suites ran already, on this tree. It fails OPEN: anything
#                       it cannot establish is an empty output and the whole graph runs. `ci:full` on the pull request forces
#                       that (scripts/full-run-reuse.mjs; a push, a Full run and a release-branch pull request never reuse).
#   changelog           the pull request's CHANGELOG check, a job of its own because a reused run skips every suite job and the
#                       check is not one of them. It waits for nothing and carries no condition.
#
# Everything that does not need the application image starts at t=0, in parallel (after `reuse`'s answer):
#
#   client-tests        the client's unit tests and its production build (its own `npm ci`)
#   standalone-pure     the standalone files that need nothing but `server/dist` (and `client/dist`)
#   standalone-db       the standalone files that open the harness MongoDB: ythril-mongo-a and nothing else. A MATRIX, one
#                       job per shard of the `-db` plan (`testing/_shared/db-shard-plan.mjs`), each with its own fresh Mongo:
#                       the runner's one-shard mode (`YTHRIL_TEST_DB_SHARDS` with `YTHRIL_TEST_DB_SHARD_INDEX`) runs only that
#                       shard's files. A runner has room for one Mongo, so the shards run as jobs and not as containers of
#                       one job. Held by `ci-runs-every-db-shard-exactly-once`: the matrix is exactly the plan's indices,
#                       each upload carries its index, and `Build & Test` waits for the job and checks its result.
#   prepare             the docs lint, and the one build of the test image
#
# Everything that drives a running Ythril waits for `prepare`, loads the image it built and starts ONLY the services
# its suite needs (`--no-build --pull never`, so compose can neither rebuild nor pull a different image). Each carries
# `needs.prepare.result == 'success'` beside the reuse condition: `!cancelled()` replaces the default `success()` of a job
# that needs another, so without it a failed `prepare` would not stop them (held by ci-workflow-is-sound):
#
#   standalone-instance the @needs-instance standalone files: A, C and their databases
#   integration         A, B and their databases, plus the two document sidecars (doc-render, doc-office)
#   sync                A, B, C, D and their databases
#   redteam             A, B, D and their databases
#
# `Build & Test` is the only required check. It waits for every other job and fails unless each succeeded, a suite job
# having stood down only beside a named, reused Full run. It then reads the results of the run it judges: this one's, or
# (after verifying it again, failing closed) the reused Full run's. `ci-advisory` is the one job that may fail without
# failing the run (timings and trends), and it stands down on a reused run: it reads THIS run's results.
#
# What is cached, and why only that: the test image's layers and each document sidecar's layers, in the GitHub
# Actions layer cache, WRITTEN only by `prepare` on a push to main and READ by every run (a pull request that wrote
# the cache would evict the layers every other run needs, and could poison the one main reads); the npm download
# cache (setup-node), keyed on the lockfile. NOT cached, by measurement: atlas-local (the pull takes as long as a
# restore plus a load), node_modules (`npm ci` takes as long as unpacking the tree), Dockerfile cache
# mounts (the runner is fresh each run, so a mount cache is always empty). Why each timeout is what it is: see the job.
#
# ONNXRUNTIME_NODE_INSTALL_CUDA=skip on every `npm ci` is not an optimisation, it is what makes the install hermetic.
# onnxruntime-node ships its CUDA execution-provider binaries OUTSIDE npm and its postinstall downloads them from a
# GitHub release. On a runner with no nvcc the script logs "`nvcc` not found. Assuming CUDA 12" and downloads the GPU
# tarball anyway, so every build depended on a GitHub release fetch succeeding, for binaries no runner here can use.
# It failed twice in 35 minutes on 2026-08-12 with ECONNRESET / socket hang up, killing the job in ~37 seconds.
# NOT a retry: a retry around a network fetch hides the non-hermeticity and still fails when the host is down.
# Held for every install in every workflow by `cuda-download-is-skipped-everywhere`.

jobs:
  # Does this pull request reuse a green Full run of its own tree? The first job of the file and a lean one: no install (the
  # script imports node built-ins only, held by unexpected-skips-fail-the-ci-gate), no setup-node (the runner's node runs it),
  # five minutes (its own deadline is 120 s). `contents: read` for the checkout it compares trees in, `actions: read` for the
  # Actions API (the Full runs of the head SHA); the token is the deciding step's own `GH_TOKEN` and reaches nothing else. Every
  # value of the pull request reaches the script through `env:`, never inside the shell text. A push, a Full run and every other
  # event skip this job (the suite jobs then run, their condition being an empty output). Any failure inside it is an empty output
  # too: the script fails open, and says why in the step summary (an error-class reason as a warning).
  reuse:
    name: Full run reuse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full_run: ${{ steps.decide.outputs.full_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every step.
          persist-credentials: false

      - name: Decide whether a Full run of this tree is reused
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The names of the pull request's labels, as a JSON list: `ci:full` among them forces the whole graph.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/full-run-reuse.mjs decide

  # A change to shipped code needs a CHANGELOG entry under [Unreleased]. The rule was already the house rule and was being
  # followed; nothing enforced it, and a rule kept alive by memory is one distracted afternoon from lapsing, invisibly. A job of
  # its own (it was a step of `prepare`): a pull request that reuses a Full run skips every suite job, and this check is not a
  # suite. It waits for nothing and has no condition, so no failed or skipped job can keep it from running; the STEP is PR-only,
  # because on a push to main there is no base to diff against and the entry was already required of the pull request.
  changelog:
    name: CHANGELOG entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the check diffs `base...HEAD`, which needs a MERGE BASE. The default shallow clone has none, and
          # the failure mode is the bad one: the diff errors, the check skips, and a missing entry looks like a passing build.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every step.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CHANGELOG entry for shipped changes
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-changelog.mjs "origin/$GITHUB_BASE_REF"

  client-tests:
    name: Client tests
    needs: reuse
    # Stands down when a pull request reuses a Full run of its own tree (`reuse`'s output names it). `!cancelled()`, not the
    # default `success()`: a failed or skipped `reuse` job must run the whole graph, never skip it.
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' }}
    runs-on: ubuntu-latest
    # Measured 130-145 s of tests plus a 30 s production build; 15 minutes is five times that, and a hung Vitest
    # worker is the failure it bounds.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=client --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Client unit tests
        id: client-unit-tests
        # Vitest + jsdom (see client/vitest.config.ts). This is what makes change-detection work (OnPush / zoneless)
        # verifiable rather than shipped on a green build: OnPush's failure mode is a silently-stale view, invisible
        # to `ng build`.
        # The JSON report beside the console one is what `Build & Test` reads for skips (scripts/unexpected-skips.mjs:
        # no skip is expected in the client). `--outputFile.json` is relative to the workspace, hence `../`; the default
        # reporter is named so the log reads as it did. Called as the workspace script, NOT `npm run test:client --`:
        # that script is itself an `npm run`, so flags after one `--` land on the INNER npm as unknown config and
        # vitest never sees them (no report is written, and the upload then fails on an empty folder).
        run: npm run test --workspace=client -- --reporter=default --reporter=json --outputFile.json=../test-results/client.json

      - name: Mask the client report
        # The report holds every failure message in full (stack, diff, runner paths); the folder is uploaded below as a
        # public artifact. Masked IN PLACE, always (a failing test is when it holds a failure), and a report that
        # cannot be read is removed rather than uploaded raw (scripts/mask-client-report.mjs).
        # The test step's own verdict goes in with it, as the report's `runnerOutcome`: a run cut off or failed by its
        # runner can leave a report that counts no failure, and the recorder reads the stamp to call that incomplete.
        if: always()
        env:
          CLIENT_TEST_OUTCOME: ${{ steps.client-unit-tests.outcome }}
        run: node scripts/mask-client-report.mjs test-results/client.json

      - name: Build client (production)
        # Not redundant with the unit tests. Measured by injecting a template reference to a non-existent member: in
        # a component that HAS a render spec, Vitest catches it; in a component with NO spec, Vitest passes green and
        # only the AOT build reports it (TS2339). Components without a spec are a standing share of the client, so the
        # second case is not a rarity. Bundle budgets (angular.json) are likewise enforced only here. The image build repeats it inside
        # Docker ten minutes into a buildx log; here it fails in about thirty seconds.
        run: npm run build:client

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-client-tests-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

  standalone-pure:
    name: Standalone (no services)
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' }}
    runs-on: ubuntu-latest
    # The offline files that need no database: measured about 145 s of tests after about 80 s of install and builds.
    # 30 minutes is a hung file, not a slow one.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        # Required by the standalone files that import server/dist/.
        run: npm run build:server

      - name: Build client (production)
        # `no-external-assets` reads the production build and refuses under CI when there is none: a silent pass here
        # is a build nobody checked for remote assets.
        run: npm run build:client

      - name: Standalone tests that need no services
        run: npm run test:standalone:pure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-standalone-pure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

  standalone-db:
    name: Standalone (database, shard ${{ matrix.shard }})
    needs: reuse
    # One condition for the whole matrix: a skipped matrix is a single skipped job, so no shard stands down alone.
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' }}
    runs-on: ubuntu-latest
    # One shard of the `-db` plan per job, against a Mongo of its own. `fail-fast` is off so one red shard does not hide
    # the verdict of the others; `Build & Test` fails when any of them failed (a matrix job's result is the worst of its
    # jobs). The matrix must be exactly 0 to the count minus one, and the count must be the one the test step sets: a short
    # matrix is files that run nowhere, a repeated index is files that run twice (held by `ci-runs-every-db-shard-exactly-once`).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Each job carries one shard, so the old bound for the whole third is far more than a shard needs; 30 minutes is what
    # bounds a wedged Mongo.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=server --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        run: npm run build:server

      - name: Pull the database image
        # The image the compose file pins by digest, read out of the compose file so the pin has one home.
        run: |
          docker compose -p ythril-test -f testing/docker-compose.test.yml config --images \
            | grep -F mongodb-atlas-local | sort -u | xargs -n1 docker pull --quiet

      - name: Start the database
        # Only ythril-mongo-a: it is the one the harness connects to (127.0.0.1:27117). The harness tunes it itself
        # on every open, so no setup script runs here.
        run: |
          docker compose -p ythril-test -f testing/docker-compose.test.yml up -d --wait --wait-timeout 300 \
            --no-build --pull never ythril-mongo-a

      - name: Standalone tests that open the database
        # This job's shard of the plan, against the Mongo started above: the runner starts no container of its own, and
        # refuses (non-zero) an index outside 0 to the count minus one rather than running everything or nothing.
        run: npm run test:standalone:db
        env:
          YTHRIL_TEST_DB_SHARDS: 4
          YTHRIL_TEST_DB_SHARD_INDEX: ${{ matrix.shard }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The index is in the name: uploads from every shard under one name would be refused, or overwrite each other.
          name: test-results-standalone-db-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-test-stack-logs

  prepare:
    name: Prepare
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' }}
    runs-on: ubuntu-latest
    # Measured: about 95-115 s for the image build on a warm cache, 2-3 minutes cold plus the HuggingFace model
    # fetch; the checks around it take under a minute. 30 minutes bounds a stalled registry or cache service.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, as every job that reads this repository has it (the CHANGELOG check that needed a merge base is
          # the `changelog` job's now).
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The ROOT project only (the docs linter). Nothing in this job runs the server or the client, and
        # every install script that runs here runs BEFORE the cache token below is exposed to the job.
        run: npm ci --workspaces=false
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Lint docs
        run: npm run lint:docs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache to Buildx
        # Sets ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN so `--cache-from/--cache-to type=gha` works from a script.
        # Pinned to a commit (v3.1.0) because it hands a credential to the step after it, and a tag can be moved.
        # Immediately before the one step that uses it, and after the only `npm ci`.
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124

      - name: Build test image (shared GHA layer cache)
        # Build the image ONCE and write it as an archive: every stack job loads that archive, and every compose
        # service uses the tag (see the compose file), so the stack is never rebuilt per instance. The layer cache
        # means the embedding model (a cache-stable early layer in the Dockerfile) is restored across runs instead of
        # re-downloaded from HuggingFace, whose anonymous per-IP rate limit was intermittently 403-ing shared CI
        # runners at build time. `--output type=docker,dest=` writes the archive directly: no `--load` into the local
        # daemon and no `docker save` round trip.
        #
        # The cache is READ on every run and WRITTEN on a push to main only.
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ythril-test \
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--cache-to type=gha,mode=max,scope=ythril-test' || '' }} \
            --output type=docker,dest=ythril-test-image.tar \
            -t ythril-test:latest -f Dockerfile .

      - name: Fill the document sidecars' layer caches (main only)
        # The integration job builds doc-render and doc-office from their own scopes and can only READ them. This is
        # the one place that writes them, and only on main, so a pull request's first run builds them cold and every
        # run after the first merge reads them warm. `cacheonly`: nothing is loaded or exported here.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build --cache-from type=gha,scope=ythril-doc-render --cache-to type=gha,mode=max,scope=ythril-doc-render --output type=cacheonly sidecars/doc-render
          docker buildx build --cache-from type=gha,scope=ythril-doc-office --cache-to type=gha,mode=max,scope=ythril-doc-office --output type=cacheonly sidecars/doc-office

      - name: Upload the test image
        # The Ythril test image only. It carries NOTICE and LICENSE exactly as the published image does (the same
        # Dockerfile), which is why it may be a download of a public repository. NO sidecar image and NO database
        # image ever goes here (held by ci-workflow-is-sound). One day: it is a build output, not a record.
        uses: actions/upload-artifact@v4
        with:
          name: ythril-test-image-${{ github.run_attempt }}
          path: ythril-test-image.tar
          if-no-files-found: error
          retention-days: 1
          # The model layer is half the archive and does not compress; the CPU would buy nothing.
          compression-level: 0

  standalone-instance:
    name: Standalone (instances)
    needs: [reuse, prepare]
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    # The @needs-instance files, one at a time: measured about 110 s of tests after about 150 s of setup.
    # 30 minutes bounds a hung request to a wedged instance.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=server --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        run: npm run build:server

      - name: Download the test image
        uses: actions/download-artifact@v4
        with:
          name: ythril-test-image-${{ github.run_attempt }}

      - name: Load the test image and pull the database image
        # The pull does not depend on the archive, so the two overlap. The tag the archive carries is checked after
        # the load: a stack that started from some other ythril-test:latest would measure a different build.
        run: |
          set -euo pipefail
          docker compose -p ythril-test -f testing/docker-compose.test.yml config --images \
            | grep -F mongodb-atlas-local | sort -u | xargs -n1 docker pull --quiet &
          pull=$!
          docker load -i ythril-test-image.tar
          docker image inspect ythril-test:latest > /dev/null
          wait "$pull"

      - name: Start test containers
        # Instances A and C only (rate-limit.test.js drives C), with their databases, and nothing else.
        run: |
          node testing/_init/reset-test-configs.mjs
          # Ensure config bind-mount dirs are writable by the node user (uid 1000) inside the container
          mkdir -p testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          chmod 777 testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          docker compose -p ythril-test -f testing/docker-compose.test.yml up -d --wait --wait-timeout 300 \
            --no-build --pull never ythril-a ythril-c
          node testing/sync/setup.js a c

      - name: Standalone tests that need a running instance
        run: npm run test:standalone:instance

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-standalone-instance-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-test-stack-logs

  integration:
    name: Integration
    needs: [reuse, prepare]
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    # Measured 510-570 s of tests after about 150 s of setup, and one job rather than shards: standalone, not
    # integration, was the longest suite on this runner shape. A cold doc-office build (LibreOffice) is on top of it
    # on the first run. 45 minutes bounds a wedged instance.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=server --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        # Required by the integration files that import server/dist/.
        run: npm run build:server

      - name: Download the test image
        uses: actions/download-artifact@v4
        with:
          name: ythril-test-image-${{ github.run_attempt }}

      - name: Load the test image and pull the database image
        run: |
          set -euo pipefail
          docker compose -p ythril-test -f testing/docker-compose.test.yml config --images \
            | grep -F mongodb-atlas-local | sort -u | xargs -n1 docker pull --quiet &
          pull=$!
          docker load -i ythril-test-image.tar
          docker image inspect ythril-test:latest > /dev/null
          wait "$pull"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the doc-render sidecar (its own layer cache scope)
        # First-party, built in-repo (sidecars/doc-render), not in any registry. Built per job from its own scope and
        # never shipped between jobs as a download. READ-only here: `prepare` fills the scope on main.
        uses: docker/build-push-action@v6
        with:
          context: sidecars/doc-render
          load: true
          tags: ythril-doc-render:0.2.0
          cache-from: type=gha,scope=ythril-doc-render

      - name: Build the doc-office sidecar (its own layer cache scope)
        # The opt-in LibreOffice sidecar (compose profile `office`), on :8101. Run here so a shipped capability is
        # tested instead of skipped. Its first CI run builds it cold; every run after the first merge reads it warm.
        uses: docker/build-push-action@v6
        with:
          context: sidecars/doc-office
          load: true
          tags: ythril-doc-office:0.2.0
          cache-from: type=gha,scope=ythril-doc-office

      - name: Start test containers
        # A and B with their databases and the two document sidecars, at the compose file's defaults: this set is one
        # of those the machine-room gate sums (the-test-stack-leaves-the-machine-room), and the sidecars' defaults are
        # a working size for a PDF renderer and LibreOffice.
        run: |
          node testing/_init/reset-test-configs.mjs
          # Ensure config bind-mount dirs are writable by the node user (uid 1000) inside the container
          mkdir -p testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          chmod 777 testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          docker compose -p ythril-test -f testing/docker-compose.test.yml --profile office up -d --wait --wait-timeout 300 \
            --no-build --pull never ythril-a ythril-b doc-render doc-office
          node testing/sync/setup.js a b

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-test-stack-logs

  sync:
    name: Sync
    needs: [reuse, prepare]
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    # Measured 383-388 s of tests after about 150 s of setup. 45 minutes bounds a network that never converges.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=server --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        # Required by the sync files that import server/dist/.
        run: npm run build:server

      - name: Download the test image
        uses: actions/download-artifact@v4
        with:
          name: ythril-test-image-${{ github.run_attempt }}

      - name: Load the test image and pull the database image
        run: |
          set -euo pipefail
          docker compose -p ythril-test -f testing/docker-compose.test.yml config --images \
            | grep -F mongodb-atlas-local | sort -u | xargs -n1 docker pull --quiet &
          pull=$!
          docker load -i ythril-test-image.tar
          docker image inspect ythril-test:latest > /dev/null
          wait "$pull"

      - name: Start test containers
        # All four instances, each with its database: the sync topologies span A, B, C and D. No document sidecar.
        run: |
          node testing/_init/reset-test-configs.mjs
          # Ensure config bind-mount dirs are writable by the node user (uid 1000) inside the container
          mkdir -p testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          chmod 777 testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          docker compose -p ythril-test -f testing/docker-compose.test.yml up -d --wait --wait-timeout 300 \
            --no-build --pull never ythril-a ythril-b ythril-c ythril-d
          node testing/sync/setup.js

      - name: Run sync tests
        run: npm run test:sync

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sync-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-test-stack-logs

  redteam:
    name: Red team
    needs: [reuse, prepare]
    if: ${{ !cancelled() && needs.reuse.outputs.full_run == '' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    # Measured 126 s of tests after about 150 s of setup. 30 minutes bounds a hung probe.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests read tags and history (the retired-tool sweep, git log): a shallow clone fails them.
          fetch-depth: 0
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=server --include-workspace-root
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build server
        # Required by the red-team files that import server/dist/ (the shared token-rights helper does).
        run: npm run build:server

      - name: Download the test image
        uses: actions/download-artifact@v4
        with:
          name: ythril-test-image-${{ github.run_attempt }}

      - name: Load the test image and pull the database image
        run: |
          set -euo pipefail
          docker compose -p ythril-test -f testing/docker-compose.test.yml config --images \
            | grep -F mongodb-atlas-local | sort -u | xargs -n1 docker pull --quiet &
          pull=$!
          docker load -i ythril-test-image.tar
          docker image inspect ythril-test:latest > /dev/null
          wait "$pull"

      - name: Start test containers
        # Every instance the red-team files reach (read from them by ci-workflow-is-sound): infra-managed-migration
        # drives D, db-migration-disabled drives B, the token brute-force cases drive C.
        run: |
          node testing/_init/reset-test-configs.mjs
          # Ensure config bind-mount dirs are writable by the node user (uid 1000) inside the container
          mkdir -p testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          chmod 777 testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          docker compose -p ythril-test -f testing/docker-compose.test.yml up -d --wait --wait-timeout 300 \
            --no-build --pull never ythril-a ythril-b ythril-c ythril-d
          node testing/sync/setup.js a b c d

      - name: Run red-team tests
        run: npm run test:redteam

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-redteam-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-test-stack-logs

  # Not required, and allowed to fail: durations, trends and flags. It reads the other jobs' result artifacts, so it
  # waits for them, and it never gates a merge. `actions: read` is for the run's job and step timings (the Actions
  # API); only this job, `reuse` and `Build & Test` hold it. It stands down when a pull request reuses a Full run: it reads
  # THIS run's results, and a reused run has none (the Full run's own advisory job recorded the timings).
  ci-advisory:
    name: CI advisory
    needs: [reuse, client-tests, standalone-pure, standalone-db, standalone-instance, integration, sync, redteam]
    if: ${{ always() && needs.reuse.outputs.full_run == '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    # Downloads a handful of small artifacts and prints a table. 10 minutes is generous for that.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download this run's test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*-${{ github.run_attempt }}
          path: test-results
          merge-multiple: true

      - name: Timings summary
        env:
          GH_TOKEN: ${{ github.token }}
        # Per-suite totals, the slowest files and tests, every skip with its reason, the failures, and (GH_TOKEN, for
        # the Actions API) the files and suites slower than the last ten runs of main. Written to this run's step
        # summary and to the log. A baseline GitHub will not give is a warning here, never a failed summary.
        run: node scripts/test-times.mjs --summary --results test-results

  # THE merge gate, and nothing else. The ruleset requires the check context "Build & Test" by exactly this name
  # (renaming it silently drops the gate), and the merge monitor (`gh pr merge` on green) waits for that context.
  # GitHub creates it only when the jobs it needs finish, so while other jobs of this workflow are still running
  # there is NO "Build & Test" yet: the monitor reads that as in progress, never as passing.
  #
  # `if: always()` because a failed needed job would otherwise SKIP this one, and a skipped required check is not a
  # red one. Every needed job must be `success` (a cancelled or failed one is not): a check for `failure` passes
  # exactly those. A SUITE job may also be `skipped`, and only beside a named run: when `reuse` output a Full run
  # (`FULL_RUN`, through env), the suites stood down on purpose, and `reuse` itself and `changelog` must have succeeded.
  # With no run named a skipped job is a job that never ran, and fails. It needs every job of the file except
  # `ci-advisory`, which is derived and held by `ci-workflow-is-sound`, so a job added tomorrow cannot be forgotten
  # here; the same file runs the verdict in a real bash for every cell, and holds that the jobs that carry the reuse
  # condition are exactly the ones the verdict lets be skipped.
  test:
    name: Build & Test
    needs: [reuse, changelog, client-tests, standalone-pure, standalone-db, prepare, standalone-instance, integration, sync, redteam]
    if: always()
    runs-on: ubuntu-latest
    # A shell function over the results, a read of one run (the reused one's, again) and two node scripts over a few
    # megabytes of JSONL.
    timeout-minutes: 10
    # `actions: read` is for the verification and the download of ANOTHER run's artifacts (a reused Full run's): without it
    # the download is refused at the end of a green run. Held, with `reuse` and the advisory job alone, by ci-workflow-is-sound.
    permissions:
      contents: read
      actions: read
    steps:
      # Everything after this first step runs ONLY when it passed (a step that follows a failed one is skipped, and none
      # below has an `if` that would change that: `ci-workflow-is-sound` holds it). So the checks below read a COMPLETE
      # set, never the partial one a failed job leaves — a verdict about half a run would be worse than none.
      - name: Every job succeeded
        env:
          # The reuse output reaches the shell through env, never inside the script text.
          FULL_RUN: ${{ needs.reuse.outputs.full_run }}
        run: |
          fail=0
          bad() { echo "::error::$1 finished: $2"; fail=1; }
          check() { [ "$2" = success ] || bad "$1" "$2"; }
          check_suite() { [ "$2" = success ] || { [ "$2" = skipped ] && [ -n "$FULL_RUN" ]; } || bad "$1" "$2"; }
          [ -z "$FULL_RUN" ] || check reuse "${{ needs.reuse.result }}"
          check changelog "${{ needs.changelog.result }}"
          check_suite client-tests "${{ needs.client-tests.result }}"
          check_suite standalone-pure "${{ needs.standalone-pure.result }}"
          check_suite standalone-db "${{ needs.standalone-db.result }}"
          check_suite prepare "${{ needs.prepare.result }}"
          check_suite standalone-instance "${{ needs.standalone-instance.result }}"
          check_suite integration "${{ needs.integration.result }}"
          check_suite sync "${{ needs.sync.result }}"
          check_suite redteam "${{ needs.redteam.result }}"
          exit $fail

      # The run's own evidence, read once every job succeeded. Both scripts import only node built-ins, so this job
      # installs nothing (held by `unexpected-skips-fail-the-ci-gate`); it needs the checkout for the list of tracked
      # test files (`git ls-files`) and the scripts themselves.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here pushes: the token a checkout leaves in .git/config would be readable by every test and dependency.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Which run's results this check reads: this one's, or the reused Full run's after it is READ AGAIN. A suite job was
      # skipped on the strength of `reuse`'s output, so by now nothing ran and the output is trusted no further than a fresh
      # read of that run (its commit, trigger, branch, repository, latest attempt, Build & Test and every results
      # artifact, and the tree of the head). Fails CLOSED, naming the remedy: re-run the whole PR run. Writes the `run_id`
      # and `attempt` the download reads (this run's own when nothing was reused). The token is this step's alone.
      - name: Verify the reused run and name the results to read
        id: results
        env:
          FULL_RUN: ${{ needs.reuse.outputs.full_run }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/full-run-reuse.mjs verify

      - name: Download every job's test results
        uses: actions/download-artifact@v4
        with:
          # The verified run's artifacts and attempt only (this run's own when nothing was reused): a re-run of one job must
          # not read the first attempt's files beside its own. `github-token` is what lets the download read another run.
          run-id: ${{ steps.results.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: test-results-*-${{ steps.results.outputs.attempt }}
          path: test-results
          merge-multiple: true

      - name: Every tracked test file produced a test event
        # A file a job's glob matched that loaded and registered nothing is "all tests pass" about a test that never ran.
        run: node scripts/executed-tests.mjs --results test-results

      - name: No skip nobody expected
        # Exit 1 names each skipped test (file, test, reason); only `expected-in-ci:` in a listed file
        # (testing/_shared/expected-in-ci.mjs) may stand. Exit 2 is a results set that cannot answer.
        run: node scripts/unexpected-skips.mjs --results test-results
