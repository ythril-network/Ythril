name: CI

on:
  # Release branches too (Q-56): a patch is bumped through a PR into release/X.Y.x, and Build & Test is the merge gate.
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the CHANGELOG check below diffs `base...HEAD`, which needs a MERGE BASE. The default
          # shallow clone has none, and the failure mode is the bad one — the diff errors, the check skips, and a
          # missing entry looks like a passing build.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ONNXRUNTIME_NODE_INSTALL_CUDA=skip is not an optimisation, it is what makes this step hermetic.
      #
      # onnxruntime-node ships its CUDA execution-provider binaries OUTSIDE npm (too large for the registry) and
      # its postinstall downloads them from a GitHub release. On a runner with no nvcc the script logs
      # "`nvcc` not found. Assuming CUDA 12" and downloads the GPU tarball anyway - so every build depended on a
      # GitHub release fetch succeeding, for binaries no runner here can use.
      #
      # It failed twice in 35 minutes on 2026-08-12 with ECONNRESET / socket hang up, killing the job in ~37
      # seconds. Reading it as a test failure wastes the diagnosis; a job that dies that fast died before the
      # tests. `skip` is the flag the install script documents for exactly this.
      #
      # NOT a retry. A retry around a network fetch hides the non-hermeticity and still fails when the release
      # host is down; removing the fetch removes the dependency.
      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      # A change to shipped code needs a CHANGELOG entry under [Unreleased].
      #
      # The rule was already the house rule and was being followed — 28 PRs in the batch that added this, every one
      # with an entry. Nothing enforced it, and a rule kept alive by memory is one distracted afternoon from lapsing,
      # invisibly: nobody notices the entry that was never written.
      #
      # PRs only. On a push to main there is no base to diff against, and the entry was already required of the PR.
      - name: CHANGELOG entry for shipped changes
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-changelog.mjs "origin/$GITHUB_BASE_REF"

      - name: Lint docs
        run: npm run lint:docs

      - name: Build server
        run: npm run build:server
        # Required by testing/standalone/oidc.test.js which imports server/dist/

      - name: Client unit tests
        # Vitest + jsdom (see client/vitest.config.ts). Runs fast, before the slow Docker
        # build, so a client regression fails the job quickly. This is what makes change-
        # detection work (OnPush / zoneless — P5) verifiable rather than shipped on a green
        # build: OnPush's failure mode is a silently-stale view, invisible to `ng build`.
        run: npm run test:client

      - name: Build client (production)
        # The production build already runs in CI — the Dockerfile's client-builder stage does
        # `npm run build:prod --workspace=client`, so the image build below would fail on it. What this
        # step changes is WHEN and HOW LEGIBLY: there it fails ~10 minutes in, inside a buildx log
        # interleaved with layer caching. Here it fails in about ten seconds. Same reasoning as the
        # unit-test step above.
        #
        # It is not redundant with `test:client`. Measured by injecting a template reference to a
        # non-existent member:
        #   - in a component that HAS a render spec, Vitest catches it (the render throws);
        #   - in a component that has NO spec, Vitest passes 680/680 green and only the AOT build
        #     reports it (TS2339 from the angular-compiler plugin).
        # 19 of this repo's 67 components have no spec, so that second case is the common one.
        # Bundle budgets (`all`: warn 8mb / error 12mb in angular.json) are likewise enforced only here.
        run: npm run build:client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache to Buildx
        # Sets ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN so `--cache-to type=gha` works.
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build test image (shared GHA layer cache)
        # Build the image ONCE with a persistent GitHub Actions layer cache and tag it
        # ythril-test:latest — every compose service reuses that tag (see the compose
        # file), so the stack is not rebuilt per instance. The cache means the embedding
        # model (a cache-stable early layer in the Dockerfile) is restored across runs
        # instead of re-downloaded from HuggingFace, whose anonymous per-IP rate limit
        # was intermittently 403-ing shared CI runners at build time.
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ythril-test \
            --cache-to type=gha,mode=max,scope=ythril-test \
            --load -t ythril-test:latest \
            -f Dockerfile .

      - name: Build doc-render sidecar image (F11)
        # First-party, built in-repo (sidecars/doc-render) — not in any registry, so pre-build it with an
        # explicit context and tag. This makes it present locally, so `docker compose up` below reuses it
        # instead of attempting a (denied) registry pull, and avoids relying on compose's relative
        # build-context resolution.
        run: docker build -t ythril-doc-render:0.1.0 sidecars/doc-render

      - name: Start test containers
        run: |
          # Ensure config bind-mount dirs are writable by the node user (uid 1000) inside the container
          mkdir -p testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          chmod 777 testing/sync/configs/a testing/sync/configs/b testing/sync/configs/c testing/sync/configs/d
          docker compose -p ythril-test -f testing/docker-compose.test.yml up -d --wait --wait-timeout 300
          node testing/sync/setup.js

      - name: Run all tests
        run: npm run test:all:core

      # A server-side failure is invisible from the test output alone. When a reconcile
      # logs an error and returns, or a sidecar never comes up, the assertion reports a
      # bare 404 and the reason lives in the container log — which teardown then throws
      # away. Dumping the logs on failure is the difference between diagnosing a red
      # build and guessing at it across 15-minute round trips.
      # `--all` is load-bearing. `ps --services` lists only RUNNING containers, so a container that
      # exited during startup — the one whose logs you actually need — was the single service this loop
      # skipped. A `ythril-b exited (1)` failure dumped healthy logs for a, c and d and nothing at all
      # for b, twice, and was written off as environmental both times because nobody could see why.
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p ythril-test -f testing/docker-compose.test.yml ps --all
          for svc in $(docker compose -p ythril-test -f testing/docker-compose.test.yml ps --services --all); do
            echo "::group::$svc"
            docker compose -p ythril-test -f testing/docker-compose.test.yml logs --tail 500 "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down containers
        if: always()
        run: docker compose -p ythril-test -f testing/docker-compose.test.yml down -v --remove-orphans
