# ── Ythril Deployment ────────────────────────────────────────────────────────
# This manifest deploys Ythril with the unstructured-api sidecar for
# server-side PDF / DOCX / EPUB conversion.
#
# BEFORE DEPLOYING: Verify the unstructured-api image tag's LICENSE file:
#   docker run --rm --entrypoint cat \
#     downloads.unstructured.io/unstructured-io/unstructured-api:<TAG> \
#     /app/LICENSE
# Confirm it is Apache-2.0 with no commercial-use restrictions.
# Repeat on every version bump.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ythril
  labels:
    app: ythril
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: a rollout otherwise runs the old and the new pod over the same data
  # volume at once, and each process's file locks guard only its own writes. The new pod's background pass
  # encrypting files in place (F-43) could then rename a stale copy over a write the old pod had just made.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ythril
  template:
    metadata:
      labels:
        app: ythril
    spec:
      # Pod-level hardening applied to every container. seccompProfile confines
      # syscalls to the runtime default set; fsGroup makes the mounted volumes
      # group-owned by gid 1000 so the non-root `node` user (uid/gid 1000, from
      # the node:22-slim base) can write to them.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        # ── Main Ythril container ────────────────────────────────────────────
        - name: ythril
          # Pin by immutable digest in production — a mutable tag (`:latest` or a
          # version tag) lets a compromised registry silently swap the image on the
          # next pull. Resolve the digest with:
          #   docker buildx imagetools inspect ghcr.io/ythril-network/ythril:2.0.0
          # then replace the tag below with @sha256:<digest>.
          image: ghcr.io/ythril-network/ythril:2.0.0
          # The image already sets `USER node`; these settings *enforce* non-root at
          # the cluster level and lock the container down further. readOnlyRootFilesystem
          # is safe here because every path the server writes is backed by a volume:
          #   /data   — DATA_ROOT: file bytes, upload chunks, face/media models (PVC)
          #   /config — CONFIG_PATH: config.json, secrets.json, schema library (PVC)
          #   /tmp    — os.tmpdir() scratch for audio/video embedding (emptyDir)
          # The embedding model is baked into the image at /app/model-cache (read-only)
          # and is loaded, never written, at runtime — so it must NOT be shadowed by a
          # writable mount. It is loaded by a CHILD process of this container (started on
          # the first embed, ended after ten idle minutes), which reads the same path and
          # is started from the same image, so nothing here needs a second entry for it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3200
          env:
            - name: DATA_ROOT
              value: /data
            # When the unstructured sidecar is running in the same Pod,
            # Ythril reaches it on the loopback interface.
            - name: CONVERSION_SIDECAR_URL
              value: http://localhost:8000
          # The conversion/embedding pipeline is CPU- and memory-hungry; without a
          # limit an unbounded main container is a node-level DoS. Requests reserve
          # headroom for the embedding model (~274 MB) plus the Node heap. The model runs
          # in a child process of this container, so the limits below count the server AND
          # that process together (and the child exits when idle, returning its memory);
          # they are one allowance for two processes, not one each.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /ready
              port: 3200
            failureThreshold: 30
            periodSeconds: 10

        # ── Unstructured sidecar ────────────────────────────────────────────
        # Handles PDF / DOCX / EPUB → Markdown conversion.
        # Runs in the same Pod so traffic stays on localhost (bypasses Cilium).
        # strategy=auto: fast text-layer extraction for digital PDFs;
        # hi_res OCR (Tesseract/PaddleOCR) for scanned/image-only PDFs.
        #
        # Image: downloads.unstructured.io/unstructured-io/unstructured-api
        # License: Apache-2.0 (verify before pinning any new tag — see note above)
        # NOTE: the `-full` variant was made private on quay.io (401 on pull); the public
        # `unstructured-api` image is the same release minus extra Tesseract language packs
        # and still bundles OCR model weights (Tesseract). SIZE, measured rather than estimated:
        # ≈10.8 GB to download (26 compressed layers, from the registry manifest) and 20–32 GB on disk
        # depending on the storage driver — 20.7 GB observed on k3s/containerd, 31.9 GB on Docker
        # Desktop. Pre-pull on nodes before first deployment to avoid cold-start delays on restarts.
        - name: unstructured
          # Pinned to the manifest-list digest so a re-pull cannot silently substitute a different
          # image — this is the highest-risk parser in the deployment. Verify the LICENSE before
          # changing it: `docker run --rm --entrypoint cat <image> /app/LICENSE` (Apache-2.0).
          image: downloads.unstructured.io/unstructured-io/unstructured-api:0.1.2@sha256:986bc7e5d6c24916c22d45d925db366f55bf4d2ebb0079a7b5d38b48fbc6fb1d
          env:
            # WITHOUT THIS, EVERY hi_res EXTRACTION FAILS on a no-egress cluster with
            #   "Can't load image processor for 'microsoft/table-transformer-structure-recognition'"
            # — total failure, not degradation. The layout and table models ARE baked into the image,
            # but huggingface_hub calls the hub to *resolve* them before reading its own cache, and a
            # default-deny egress policy blocks that call. Offline mode makes it use what it has.
            # Do NOT set HOME or XDG_CACHE_HOME here: the image's HOME=/home/notebook-user is what
            # locates that baked cache, and moving it makes the image try to download instead.
            - name: HF_HUB_OFFLINE
              value: "1"
            # numba compiles a function and caches it NEXT TO the installed package, and matplotlib
            # wants a config dir — both fail on a read-only root filesystem, so point them at the
            # writable scratch mount below.
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
          # The image runs as uid 1000 (`notebook-user`) — confirmed from its registry config, not by
          # experiment — so the full Pod Security Admission `restricted` set is assertable here.
          # Declared explicitly so a deployer does not have to run the image to find out.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Everything the OCR pipeline writes at request time lands here, which is what lets the
            # root filesystem stay read-only.
            - name: unstructured-tmp
              mountPath: /tmp
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              # Measured on a real hi_res extraction: 1.73 GB RSS across 61 threads, using roughly 4
              # cores. The previous 1000m limit throttled that to a quarter of what the job wants —
              # this now matches the compose sizing (`UNSTRUCTURED_CPUS`, default 4.0) so the two
              # deployment paths do not disagree about the shape of the workload.
              cpu: "4000m"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            # Large failureThreshold to allow the OCR model weights to load on
            # first start (especially without pre-pulled images).
            failureThreshold: 60
            periodSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ythril-data
        - name: config
          persistentVolumeClaim:
            claimName: ythril-config
        # os.tmpdir() scratch (audio/video embedding). Ephemeral by design — nothing
        # here must survive a restart, so an emptyDir satisfies readOnlyRootFilesystem
        # without provisioning storage.
        - name: tmp
          emptyDir: {}
        # Per-request OCR scratch for the unstructured sidecar (numba/matplotlib caches, page images).
        # Sized because hi_res spills page renders here; ephemeral, so an emptyDir keeps the sidecar's
        # root filesystem read-only without provisioning storage.
        - name: unstructured-tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Persistent config store. /config holds config.json (tokens, spaces, networks),
# secrets.json, and the schema library — all runtime-mutable state that must
# survive Pod restarts. Previously /config was unmounted, so this state was lost
# on every restart; readOnlyRootFilesystem also requires it to be a real volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ythril-config
  labels:
    app: ythril
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
